services:
  # FastAPI demo app, instrumented with the OpenTelemetry SDK. Ships all
  # telemetry (metrics/logs/traces) over OTLP/gRPC to the collector — it
  # never talks to Prometheus/Loki/Tempo directly.
  app:
    build: ./app
    container_name: app
    ports:
      - "8000:8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: observability-demo-api  # becomes the "job" label once metrics hit Prometheus
      SERVICE_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: local
      SLOW_MIN_SECONDS: "2"
      SLOW_MAX_SECONDS: "5"
      ORDERS_FAIL_RATE: "0"
      ORDERS_SLOW_RATE: "0"
    depends_on:
      - otel-collector

  # OpenTelemetry Collector: single ingestion point for the app's telemetry.
  # Fans metrics/logs/traces out to the three backends below, each over the
  # protocol that backend actually wants (remote-write, OTLP/HTTP, OTLP/gRPC).
  # See otel-collector/config.yaml for the receiver/exporter pipeline.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC — what the app sends to
      - "4318:4318"  # OTLP HTTP
    depends_on:
      # waits on healthy backends so the first push/export attempts don't fail
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # Metrics store. The collector pushes to it via remote-write (see
  # --web.enable-remote-write-receiver below) instead of Prometheus scraping
  # the collector — that way the "job" label on every series is the app's
  # own service name (set via prometheusremotewrite exporter's resource-attr
  # mapping), not "otel-collector".
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"  # required: this flag opens /api/v1/write, off by default
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Log store. Receives logs over OTLP/HTTP (native OTLP endpoint added in
  # Loki 3.x, see otlphttp/loki exporter in the collector config) rather than
  # the older Promtail/push-api route. Single-binary, filesystem-backed —
  # fine for a local lab, not how you'd run it in prod (no replication/HA).
  loki:
    image: grafana/loki:3.6.17
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    # 3.6.17's image is fully distroless (no wget/sh/busybox at all, unlike
    # the 3.2.1 image this stack originally pinned) — no way to run a
    # Docker-level HEALTHCHECK anymore. Same situation as Tempo/otel-collector
    # below: retried-on by consumers instead (OTLP exporters retry automatically).

  # Trace store. Receives spans over OTLP/gRPC directly (its distributor
  # embeds an OTLP receiver, so no translation needed like Loki/Prometheus
  # need). Local disk backend, 1h block retention — traces are meant to be
  # short-lived here, just enough to demo trace_id correlation from Loki logs.
  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"

  # Grafana, provisioned (not clicked through) with all three datasources —
  # see grafana/provisioning/datasources/datasources.yaml. Anonymous access
  # is enabled as Admin purely for lab convenience; don't do this outside
  # a local/throwaway environment.
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
